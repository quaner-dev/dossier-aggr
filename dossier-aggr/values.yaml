        - name: ArchiveSubjectQuerySync
          method: POST
          route: "/VIID/ArchiveSubjectQuerySync"
        - name: ArchiveSubjectCreate
          method: POST
          route: "/VIID/ArchiveSubjects"
        - name: ArchiveSubjectUpdate
          method: PUT
          route: "/VIID/ArchiveSubjects"
        - name: ArchiveSubjectDelete
          method: DELETE
          route: "/VIID/ArchiveSubjects"
        - name: VehicleArchivesQuerySync
          method: POST
          route: "/VIID/VehicleArchivesQuerySync"
        - name: VehicleArchivesCreate
          method: POST
          route: "/VIID/VehicleArchives"
        - name: VehicleArchivesUpdate
