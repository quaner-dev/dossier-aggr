# Default values for dossier-aggr.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: sealos.hub:5000/infra-j10000
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "202505281312-8242379c"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 8000
  annotations: {}

containerPort: 8000

command:
  - uvicorn

args:
  - main:app
  - --host
  - 0.0.0.0
  - --port
  - "8000"

env:
  ENV: prod
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgresql:5432/dossier_aggr
  TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/0
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_POOL_TIMEOUT_SECONDS: "30"
  DB_POOL_RECYCLE_SECONDS: "1800"
  DB_POOL_PRE_PING: "true"
  RABBITMQ_USERNAME: guest
  RABBITMQ_PASSWORD: guest
  RABBITMQ_IP: rabbitmq
  RABBITMQ_PORT: "5672"
  TASK_RESULT_TIMEOUT_SECONDS: "10"

envFrom: []

monitoring:
  enabled: true
  metricsPath: /metrics
  scrapeInterval: 30s
  serviceMonitor:
    enabled: false
    additionalLabels: {}
  grafanaDashboard:
    enabled: true
    # Labels for Grafana sidecar dashboard discovery.
    labels:
      grafana_dashboard: "1"
    additionalLabels: {}
    annotations: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}
    groupName: dossier-aggr.rules
    # Alert thresholds (5m window unless noted).
    errorRateThreshold: 0.05
    p95LatencySeconds: 1.0
    ormP95Seconds: 0.2
    for: 10m
    routeAlerts:
      enabled: true
      window: 5m
      routes:
        - name: SystemRegister
          method: POST
          route: "/VIID/System/Register"
        - name: SystemUnRegister
          method: POST
          route: "/VIID/System/UnRegister"
        - name: SystemKeepalive
          method: POST
          route: "/VIID/System/Keepalive"
        - name: SystemTime
          method: GET
          route: "/VIID/System/Time"
        - name: ApsList
          method: GET
          route: "/VIID/APSs"
        - name: ApeList
          method: GET
          route: "/VIID/APEs"
        - name: ApeUpdate
          method: PUT
          route: "/VIID/APEs"
        - name: FaceList
          method: GET
          route: "/VIID/Faces"
        - name: FaceCreate
          method: POST
          route: "/VIID/Faces"
        - name: FaceUpdate
          method: PUT
          route: "/VIID/Faces"
        - name: FaceDelete
          method: DELETE
          route: "/VIID/Faces"
        - name: FaceGetByID
          method: GET
          route: "/VIID/Faces/{face_id}"
        - name: FaceUpdateByID
          method: PUT
          route: "/VIID/Faces/{face_id}"
        - name: FaceDeleteByID
          method: DELETE
          route: "/VIID/Faces/{face_id}"
        - name: PersonList
          method: GET
          route: "/VIID/Persons"
        - name: PersonCreate
          method: POST
          route: "/VIID/Persons"
        - name: PersonUpdate
          method: PUT
          route: "/VIID/Persons"
        - name: PersonDelete
          method: DELETE
          route: "/VIID/Persons"
        - name: PersonGetByID
          method: GET
          route: "/VIID/Persons/{person_id}"
        - name: PersonUpdateByID
          method: PUT
          route: "/VIID/Persons/{person_id}"
        - name: PersonDeleteByID
          method: DELETE
          route: "/VIID/Persons/{person_id}"
        - name: SubscribeCreate
          method: POST
          route: "/VIID/Subscribes"
        - name: SubscribeList
          method: GET
          route: "/VIID/Subscribes"
        - name: SubscribeUpdate
          method: PUT
          route: "/VIID/Subscribes"
        - name: SubscribeDelete
          method: DELETE
          route: "/VIID/Subscribes"
        - name: SubscribeUpdateByID
          method: PUT
          route: "/VIID/Subscribes/{subscribe_id}"
        - name: SubscribeNotificationCreate
          method: POST
          route: "/VIID/SubscribeNotifications"
        - name: SubscribeNotificationList
          method: GET
          route: "/VIID/SubscribeNotifications"
        - name: SubscribeNotificationDelete
          method: DELETE
          route: "/VIID/SubscribeNotifications"
        - name: ArchiveLibraryList
          method: GET
          route: "/VIID/ArchiveLibraries"
        - name: ArchiveLibraryCreate
          method: POST
          route: "/VIID/ArchiveLibraries"
        - name: ArchiveLibraryUpdate
          method: PUT
          route: "/VIID/ArchiveLibraries"
        - name: ArchiveLibraryDelete
          method: DELETE
          route: "/VIID/ArchiveLibraries"
        - name: TaskList
          method: GET
          route: "/VIAS/Tasks"
        - name: TaskCreate
          method: POST
          route: "/VIAS/Tasks"
        - name: TaskUpdate
          method: PUT
          route: "/VIAS/Tasks"
        - name: TaskDelete
          method: DELETE
          route: "/VIAS/Tasks"
        - name: ArchivesQuerySync
          method: POST
          route: "/VIID/ArchivesQuerySync"
        - name: ArchivesCreate
          method: POST
          route: "/VIID/Archives"
        - name: ArchivesUpdate
          method: PUT
          route: "/VIID/Archives"
        - name: ArchivesDelete
          method: DELETE
