{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "dossier-aggr.fullname" . }}
  labels:
    {{- include "dossier-aggr.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ .Values.monitoring.prometheusRule.groupName }}
      rules:
        - alert: DossierAggrHighErrorRate
          expr: |
            (
              sum(rate(dossier_aggr_http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(dossier_aggr_http_requests_total[5m]))
            ) > {{ .Values.monitoring.prometheusRule.errorRateThreshold }}
          for: {{ .Values.monitoring.prometheusRule.for }}
          labels:
            severity: warning
          annotations:
            summary: "dossier-aggr HTTP 5xx error rate is high"
            description: "HTTP 5xx ratio has exceeded threshold in the last 5 minutes."

        - alert: DossierAggrHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(dossier_aggr_http_request_duration_seconds_bucket[5m])) by (le)
            ) > {{ .Values.monitoring.prometheusRule.p95LatencySeconds }}
          for: {{ .Values.monitoring.prometheusRule.for }}
          labels:
            severity: warning
          annotations:
            summary: "dossier-aggr HTTP p95 latency is high"
            description: "Overall HTTP p95 latency has exceeded the configured threshold."

        - alert: DossierAggrORMSlowQueries
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(dossier_aggr_orm_query_duration_seconds_bucket[5m])) by (le)
            ) > {{ .Values.monitoring.prometheusRule.ormP95Seconds }}
          for: {{ .Values.monitoring.prometheusRule.for }}
          labels:
            severity: warning
          annotations:
            summary: "dossier-aggr ORM query p95 latency is high"
            description: "ORM p95 query latency has exceeded the configured threshold."

        - alert: DossierAggrTaskEnqueueErrors
          expr: |
            sum(rate(dossier_aggr_task_enqueued_total{status="error"}[5m])) > 0
          for: {{ .Values.monitoring.prometheusRule.for }}
          labels:
            severity: critical
          annotations:
            summary: "dossier-aggr task enqueue errors detected"
            description: "Task enqueue error rate is non-zero."

{{- if .Values.monitoring.prometheusRule.routeAlerts.enabled }}
{{- range .Values.monitoring.prometheusRule.routeAlerts.routes }}
        - alert: DossierAggrRouteHighErrorRate{{ .name }}
          expr: |
            (
              sum(rate(dossier_aggr_http_requests_total{method="{{ .method }}",route="{{ .route }}",status_code=~"5.."}[{{ $.Values.monitoring.prometheusRule.routeAlerts.window }}]))
              /
              clamp_min(
                sum(rate(dossier_aggr_http_requests_total{method="{{ .method }}",route="{{ .route }}"}[{{ $.Values.monitoring.prometheusRule.routeAlerts.window }}])),
                0.001
              )
            ) > {{ default $.Values.monitoring.prometheusRule.errorRateThreshold .errorRateThreshold }}
          for: {{ $.Values.monitoring.prometheusRule.for }}
          labels:
            severity: warning
            method: {{ .method | quote }}
            route: {{ .route | quote }}
          annotations:
            summary: "dossier-aggr route HTTP 5xx error rate is high"
            description: "{{ .method }} {{ .route }} HTTP 5xx ratio has exceeded threshold."

        - alert: DossierAggrRouteHighP95Latency{{ .name }}
          expr: |
            histogram_quantile(
              0.95,
              sum(rate(dossier_aggr_http_request_duration_seconds_bucket{method="{{ .method }}",route="{{ .route }}"}[{{ $.Values.monitoring.prometheusRule.routeAlerts.window }}])) by (le)
            ) > {{ default $.Values.monitoring.prometheusRule.p95LatencySeconds .p95LatencySeconds }}
          for: {{ $.Values.monitoring.prometheusRule.for }}
          labels:
            severity: warning
            method: {{ .method | quote }}
            route: {{ .route | quote }}
          annotations:
            summary: "dossier-aggr route HTTP p95 latency is high"
            description: "{{ .method }} {{ .route }} HTTP p95 latency has exceeded threshold."
{{- end }}
{{- end }}
{{- end }}
