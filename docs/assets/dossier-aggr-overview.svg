<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">dossier-aggr VIID service overview</title>
  <desc id="desc">Architecture overview showing GA/T 1400 and GA/T 2350.5 clients entering a FastAPI service, flowing through services, Taskiq, repositories and data stores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F2A3A"/>
      <stop offset="0.55" stop-color="#16495B"/>
      <stop offset="1" stop-color="#203B32"/>
    </linearGradient>
    <linearGradient id="accent" x1="156" y1="125" x2="1044" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56C1FF"/>
      <stop offset="0.5" stop-color="#38D9A9"/>
      <stop offset="1" stop-color="#F4D35E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#06131A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <path d="M84 405 C238 345 315 407 472 342 C636 274 684 153 864 175 C982 190 1040 252 1118 196" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <path d="M84 430 C244 370 316 426 480 365 C638 306 702 205 860 222 C987 236 1037 286 1118 238" stroke="#C8F4E4" stroke-width="2" stroke-linecap="round" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="72" y="74" width="1056" height="372" rx="22" fill="#F8FAFC"/>
  </g>

  <text x="118" y="133" fill="#102A3A" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">dossier-aggr</text>
  <text x="118" y="169" fill="#4B6170" font-family="Inter, Arial, sans-serif" font-size="18">FastAPI service for VIID protocol integration</text>

  <g>
    <rect x="118" y="220" width="210" height="116" rx="16" fill="#E8F4FF" stroke="#BBDCF8"/>
    <text x="146" y="260" fill="#173F5F" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">GA/T 1400</text>
    <text x="146" y="292" fill="#3D5D72" font-family="Inter, Arial, sans-serif" font-size="15">VIID system, device,</text>
    <text x="146" y="316" fill="#3D5D72" font-family="Inter, Arial, sans-serif" font-size="15">person, face, subscribe</text>
  </g>

  <g>
    <rect x="118" y="350" width="210" height="58" rx="16" fill="#EAF8F0" stroke="#B9E8CB"/>
    <text x="146" y="386" fill="#24533D" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">GA/T 2350.5</text>
  </g>

  <path d="M350 280 H458" stroke="#8FA4B3" stroke-width="3" stroke-linecap="round"/>
  <path d="M448 268 L462 280 L448 292" stroke="#8FA4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="482" y="190" width="236" height="188" rx="20" fill="#102A3A"/>
    <text x="522" y="238" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">FastAPI API</text>
    <rect x="522" y="264" width="156" height="34" rx="17" fill="#1C5369"/>
    <text x="548" y="287" fill="#DDF7FF" font-family="Inter, Arial, sans-serif" font-size="15">Swagger UI</text>
    <rect x="522" y="312" width="126" height="34" rx="17" fill="#1E665A"/>
    <text x="552" y="335" fill="#E6FFF7" font-family="Inter, Arial, sans-serif" font-size="15">ReDoc</text>
  </g>

  <path d="M738 280 H846" stroke="#8FA4B3" stroke-width="3" stroke-linecap="round"/>
  <path d="M836 268 L850 280 L836 292" stroke="#8FA4B3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="870" y="146" width="196" height="74" rx="16" fill="#FFF7D8" stroke="#F0D675"/>
    <text x="902" y="190" fill="#5F4A00" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Services</text>

    <rect x="870" y="242" width="196" height="74" rx="16" fill="#F1F5F9" stroke="#CAD5E0"/>
    <text x="902" y="286" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Taskiq Worker</text>

    <rect x="870" y="338" width="196" height="74" rx="16" fill="#ECFDF5" stroke="#AFE4C9"/>
    <text x="902" y="382" fill="#205B43" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Repo + DB</text>
  </g>

  <g opacity="0.92">
    <circle cx="1031" cy="122" r="9" fill="#38D9A9"/>
    <circle cx="1061" cy="122" r="9" fill="#56C1FF"/>
    <circle cx="1091" cy="122" r="9" fill="#F4D35E"/>
  </g>
</svg>
